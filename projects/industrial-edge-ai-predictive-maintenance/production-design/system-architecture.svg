<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1040" viewBox="0 0 1680 1040" role="img" aria-labelledby="title desc"><title id="title">EDGEOPS target production system architecture</title><desc id="desc">All thirty planned hardware categories mapped to physical sensing, acquisition, edge processing, platform services, human workflows, power protection and commissioning support. Proposed design only, not a circuit schematic or deployed system.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#168d7a"/></marker></defs><rect width="1680" height="1040" fill="#f4f7fa"/><style>text{font-family:Segoe UI,Arial,sans-serif}.title{font-size:34px;fill:#12263e;font-weight:700}.subtitle{font-size:16px;fill:#536c82}.kicker{font-size:12px;fill:#147c6d;font-weight:700;letter-spacing:1.5px}.node-title{font-size:21px;fill:#163049;font-weight:700}.line{font-size:15px;fill:#425c73}.small{font-size:12px;fill:#647b90}.flow{stroke:#168d7a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><text class="title" x="34" y="52">EDGEOPS / Target Production System</text><text class="subtitle" x="35" y="82">Design baseline 1.0 • 19 November 2026 • One guarded physical rig + isolated synthetic fleet</text><rect x="1300" y="28" width="345" height="34" rx="8" fill="#fff0d7" stroke="#e4bf7c"/><text class="small" x="1314" y="51">DESIGN CANDIDATE / NOT DEPLOYED</text><rect x="32" y="145" width="288" height="325" rx="12" fill="#ffffff" stroke="#cfdae4"/><rect x="32" y="145" width="288" height="6" rx="3" fill="#249e88"/><text class="kicker" x="52" y="180">01 / PHYSICAL OBSERVATIONS</text><text class="node-title" x="52" y="217">Protected motor bench</text><text class="line" x="52" y="252">BOM-06 · Motor</text><text class="line" x="52" y="279">BOM-20 / 25 · Guard + mount</text><text class="line" x="52" y="306">BOM-03 · ADXL345 vibration</text><text class="line" x="52" y="333">BOM-04 · DS18B20 case temp</text><text class="line" x="52" y="360">BOM-05 · Rated INA219 path</text><text class="line" x="52" y="387">Acceleration m/s² · °C · V · A</text><text class="line" x="52" y="414">No verified real setup yet</text><rect x="364" y="145" width="288" height="325" rx="12" fill="#ffffff" stroke="#cfdae4"/><rect x="364" y="145" width="288" height="6" rx="3" fill="#249e88"/><text class="kicker" x="384" y="180">02 / DATA ACQUISITION</text><text class="node-title" x="384" y="217">ESP32 sensor node</text><text class="line" x="384" y="252">BOM-02 · Enrolled board</text><text class="line" x="384" y="279">I2C + OneWire acquisition</text><text class="line" x="384" y="306">Boot/session + sequence</text><text class="line" x="384" y="333">Per-channel quality and time</text><text class="line" x="384" y="360">Serial commissioning adapter</text><text class="line" x="384" y="387">Native TLS MQTT target</text><text class="line" x="384" y="414">Timed windows after validation</text><rect x="696" y="145" width="288" height="325" rx="12" fill="#ffffff" stroke="#cfdae4"/><rect x="696" y="145" width="288" height="6" rx="3" fill="#249e88"/><text class="kicker" x="716" y="180">03 / PRIVATE EDGE ZONE</text><text class="node-title" x="716" y="217">Raspberry Pi 5</text><text class="line" x="716" y="252">BOM-01 / 08 / 09 / 10 / 11</text><text class="line" x="716" y="279">Pi + supply + case + cooler + SD</text><text class="line" x="716" y="306">Private MQTT + exact ACL</text><text class="line" x="716" y="333">Durable inbox / outbox + retry</text><text class="line" x="716" y="360">Features + approved inference</text><text class="line" x="716" y="387">Versioned ONNX / rules</text><text class="line" x="716" y="414">Visible queue and failure state</text><rect x="1028" y="145" width="288" height="325" rx="12" fill="#ffffff" stroke="#cfdae4"/><rect x="1028" y="145" width="288" height="6" rx="3" fill="#249e88"/><text class="kicker" x="1048" y="180">04 / APPLICATION ZONE</text><text class="node-title" x="1048" y="217">Production platform</text><text class="line" x="1048" y="252">FastAPI modular domains</text><text class="line" x="1048" y="279">Scoped HTTPS ingestion</text><text class="line" x="1048" y="306">PostgreSQL / time-series</text><text class="line" x="1048" y="333">Key + hash conflict detection</text><text class="line" x="1048" y="360">Atomic audit and outbox</text><text class="line" x="1048" y="387">SOP / model object storage</text><text class="line" x="1048" y="414">Protected operations services</text><rect x="1360" y="145" width="288" height="325" rx="12" fill="#ffffff" stroke="#cfdae4"/><rect x="1360" y="145" width="288" height="6" rx="3" fill="#249e88"/><text class="kicker" x="1380" y="180">05 / HUMAN DECISIONS</text><text class="node-title" x="1380" y="217">Operations workspace</text><text class="line" x="1380" y="252">Fleet / device / sensor health</text><text class="line" x="1380" y="279">Telemetry / incidents / orders</text><text class="line" x="1380" y="306">Reports / models / hardware</text><text class="line" x="1380" y="333">Cited advisory guidance</text><text class="line" x="1380" y="360">Independent human approval</text><text class="line" x="1380" y="387">Technician verification</text><text class="line" x="1380" y="414">Explicit measured / replay / sim</text><path class="flow" d="M324 285H359"/><path class="flow" d="M656 285H691"/><path class="flow" d="M988 285H1023"/><path class="flow" d="M1320 285H1355"/><text class="small" x="370" y="505">Identity + quality</text><text class="small" x="716" y="505">Broker ≠ edge ≠ central commit</text><text class="small" x="1050" y="505">Authorized facts + change hints</text><rect x="32" y="540" width="516" height="207" rx="12" fill="#ffffff" stroke="#cfdae4"/><rect x="32" y="540" width="516" height="6" rx="3" fill="#249e88"/><text class="kicker" x="52" y="575">POWER + MECHANICAL PROTECTION</text><text class="node-title" x="52" y="612">Separate, reviewed power domains</text><text class="line" x="52" y="647">BOM-07 / 17 / 18 / 19 · Supply, connector, fuse, disconnect</text><text class="line" x="52" y="674">BOM-21 / 22 · Local rated driver + topology-specific suppression</text><text class="line" x="52" y="701">BOM-23 / 24 · Sized wires and covered distribution</text><text class="line" x="52" y="728">BOM-26 · Conditional auxiliary 5 V buck; not automatic Pi power</text><rect x="582" y="540" width="516" height="207" rx="12" fill="#ffffff" stroke="#cfdae4"/><rect x="582" y="540" width="516" height="6" rx="3" fill="#249e88"/><text class="kicker" x="602" y="575">COMMISSIONING + REPLACEMENT</text><text class="node-title" x="602" y="612">All remaining hardware accounted for</text><text class="line" x="602" y="647">BOM-12 / 13 / 14 · Sensor breadboard, jumpers, USB data</text><text class="line" x="602" y="674">BOM-15 / 16 · Multimeter reference and OneWire pull-up</text><text class="line" x="602" y="701">BOM-27 / 28 · Conditional level shifter and 3.3 V UART</text><text class="line" x="602" y="728">BOM-29 / 30 · Compatible power meter and spare kit</text><rect x="1132" y="540" width="516" height="207" rx="12" fill="#ffffff" stroke="#cfdae4"/><rect x="1132" y="540" width="516" height="6" rx="3" fill="#249e88"/><text class="kicker" x="1152" y="575">INTELLIGENCE + GOVERNANCE</text><text class="node-title" x="1152" y="612">Three distinct approval domains</text><text class="line" x="1152" y="647">Offline report review is not model deployment</text><text class="line" x="1152" y="674">Work-order approval is not physical execution</text><text class="line" x="1152" y="701">Model release uses approved compatible bundles</text><text class="line" x="1152" y="728">RAG reads evidence and drafts; never authorizes control</text><rect x="32" y="787" width="1616" height="153" rx="12" fill="#16394a"/><text class="kicker" style="fill:#90ddca" x="54" y="821">CROSS-CUTTING OPERATIONS AND SECURITY</text><text x="54" y="855" font-size="17" fill="#d5e9ef">Unique device / service / human identities • Private transport • Site and asset authorization • Immutable source provenance</text><text x="54" y="885" font-size="17" fill="#d5e9ef">Metrics, logs and traces • Bounded queues / quotas • Versioned migrations • Staged release • Off-host backup + tested restore</text><text x="54" y="915" font-size="17" fill="#d5e9ef">Evidence links every hardware instance, source window, model, incident, proposal, decision, work order and release</text><text class="subtitle" x="34" y="979">30/30 category design coverage does not mean 30/30 purchased, installed or commissioned.</text><text class="small" x="34" y="1008">Functional system architecture only. Exact electrical schematic, component compatibility and production acceptance require real evidence.</text></svg>