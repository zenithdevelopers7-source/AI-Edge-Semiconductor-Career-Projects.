<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">Conditional sensor-only named-net map</title><desc id="desc">Named connection schedule for classic ESP32 GPIO21 SDA, GPIO22 SCL and GPIO4 OneWire. Motor power disconnected; actual module supply terminals must be identified first.</desc><rect width="1120" height="610" rx="14" fill="#f3f7fc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="26" y="38" font-size="25" font-weight="700" fill="#17334f">Sensor-only named-net map</text><text x="26" y="67" font-size="16" fill="#435c76">Motor supply disconnected. This is a net schedule, not a board-position drawing.</text><rect x="18" y="88" width="1084" height="44" rx="5" fill="#17334f"/><text x="26" y="116" font-size="17" font-weight="700" fill="white">Net</text><text x="225" y="116" font-size="17" font-weight="700" fill="white">ESP32 label</text><text x="430" y="116" font-size="17" font-weight="700" fill="white">ADXL345</text><text x="655" y="116" font-size="17" font-weight="700" fill="white">INA219 logic</text><text x="880" y="116" font-size="17" font-weight="700" fill="white">DS18B20</text><rect x="18" y="132" width="1084" height="55" fill="#ffffff"/><rect x="18" y="132" width="5" height="55" fill="#a53c35"/><text x="26" y="166" font-size="16" fill="#17334f">3.3V supply</text><text x="225" y="166" font-size="16" fill="#17334f">3V3</text><text x="430" y="166" font-size="16" fill="#17334f">Approved terminal*</text><text x="655" y="166" font-size="16" fill="#17334f">Approved terminal*</text><text x="880" y="166" font-size="16" fill="#17334f">VDD*</text><rect x="18" y="187" width="1084" height="55" fill="#eaf1f9"/><rect x="18" y="187" width="5" height="55" fill="#475d75"/><text x="26" y="221" font-size="16" fill="#17334f">Logic reference</text><text x="225" y="221" font-size="16" fill="#17334f">GND</text><text x="430" y="221" font-size="16" fill="#17334f">GND</text><text x="655" y="221" font-size="16" fill="#17334f">GND</text><text x="880" y="221" font-size="16" fill="#17334f">GND*</text><rect x="18" y="242" width="1084" height="55" fill="#ffffff"/><rect x="18" y="242" width="5" height="55" fill="#245eae"/><text x="26" y="276" font-size="16" fill="#17334f">I2C data</text><text x="225" y="276" font-size="16" fill="#17334f">GPIO21</text><text x="430" y="276" font-size="16" fill="#17334f">SDA</text><text x="655" y="276" font-size="16" fill="#17334f">SDA</text><text x="880" y="276" font-size="16" fill="#17334f">-</text><rect x="18" y="297" width="1084" height="55" fill="#eaf1f9"/><rect x="18" y="297" width="5" height="55" fill="#087b78"/><text x="26" y="331" font-size="16" fill="#17334f">I2C clock</text><text x="225" y="331" font-size="16" fill="#17334f">GPIO22</text><text x="430" y="331" font-size="16" fill="#17334f">SCL</text><text x="655" y="331" font-size="16" fill="#17334f">SCL</text><text x="880" y="331" font-size="16" fill="#17334f">-</text><rect x="18" y="352" width="1084" height="55" fill="#ffffff"/><rect x="18" y="352" width="5" height="55" fill="#855c14"/><text x="26" y="386" font-size="16" fill="#17334f">OneWire data</text><text x="225" y="386" font-size="16" fill="#17334f">GPIO4</text><text x="430" y="386" font-size="16" fill="#17334f">-</text><text x="655" y="386" font-size="16" fill="#17334f">-</text><text x="880" y="386" font-size="16" fill="#17334f">DATA*</text><rect x="18" y="407" width="1084" height="55" fill="#eaf1f9"/><rect x="18" y="407" width="5" height="55" fill="#855c14"/><text x="26" y="441" font-size="16" fill="#17334f">DATA pull-up</text><text x="225" y="441" font-size="16" fill="#17334f">GPIO4 to 3V3</text><text x="430" y="441" font-size="16" fill="#17334f">-</text><text x="655" y="441" font-size="16" fill="#17334f">-</text><text x="880" y="441" font-size="16" fill="#17334f">4.7k effective*</text><text x="26" y="493" font-size="15" fill="#435c76">*Verify actual sensor supply pins, probe conductors and existing pull-ups before assembly.</text><text x="26" y="521" font-size="15" fill="#435c76">ADXL345 I2C straps depend on the breakout: exposed CS to VDD I/O; exposed SDO to GND selects 0x53.</text><text x="26" y="549" font-size="15" fill="#8b4018">INA219 VIN+ / VIN- remain unconnected during sensor-only preparation.</text><text x="26" y="578" font-size="15" fill="#8b4018">No motor, driver-control, Pi GPIO or 12V-to-logic connection is assigned in this map.</text></g></svg>