name: EDGEOPS Offline Scikit-Learn Comparison

on:
  push:
    branches: [dashboard-live-edit]
    paths:
      - "projects/industrial-edge-ai-predictive-maintenance/dashboard/sklearn_comparison.py"
      - "projects/industrial-edge-ai-predictive-maintenance/dashboard/comparison_registry.py"
      - "projects/industrial-edge-ai-predictive-maintenance/dashboard/server.py"
      - "projects/industrial-edge-ai-predictive-maintenance/dashboard/tests/test_comparison_review.py"
      - "projects/industrial-edge-ai-predictive-maintenance/dashboard/run_sklearn_comparison.py"
      - "projects/industrial-edge-ai-predictive-maintenance/dashboard/tests/test_sklearn_comparison.py"
      - "projects/industrial-edge-ai-predictive-maintenance/dashboard/offline_baseline.py"
      - "projects/industrial-edge-ai-predictive-maintenance/dashboard/requirements-ml.txt"
      - ".github/workflows/edgeops-sklearn-comparison.yml"
  pull_request:
    paths:
      - "projects/industrial-edge-ai-predictive-maintenance/dashboard/**"
      - ".github/workflows/edgeops-sklearn-comparison.yml"

permissions:
  contents: read

jobs:
  sklearn-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: projects/industrial-edge-ai-predictive-maintenance/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline training dependencies
        run: python -m pip install -r requirements.txt -r requirements-ml.txt
      - name: Run equal-holdout baseline tests
        run: python -m unittest discover -s tests -p test_sklearn_comparison.py -v
      - name: Run read-only synthetic comparison CLI
        run: python run_sklearn_comparison.py
      - name: Test saved comparison integrity and authenticated review
        run: python -m unittest discover -s tests -p test_comparison_review.py -v
      - name: Save synthetic comparison report
        run: python run_sklearn_comparison.py --output .local/experiments
